name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: hygiene (repo lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Forbidden-path hygiene
        # falha se .ssh/.agent-gw/*.har/dumps reaparecerem na árvore tracked
        # (o teste só usa stdlib + git; não importa kdrx)
        run: |
          pip install pytest
          python -m pytest tests/test_repo_hygiene.py -q -p no:cacheprovider

      - name: gitleaks (hard block)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_COMMENTS: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # PIN: `uvx ruff` sem versao puxa o release mais recente — regras novas
      # (UP045/UP035/EXE001/PLR0402...) quebram o CI sem mudanca no repo.
      # Bump de ruff = mudanca deliberada aqui + sync com a versao local.
      - name: ruff check
        run: uvx ruff@0.15.8 check .

      - name: ruff format --check
        run: uvx ruff@0.15.8 format --check .

  test:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package + dev deps
        run: pip install -e .[dev]

      - name: pytest
        run: pytest tests/ -v

  typecheck:
    # ATENÇÃO: job advisory (continue-on-error). O src atual ainda não passa em
    # typecheck estrito; endurecer em PR futuro habilitando checks completos.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -e .[dev]
          pip install mypy

      - name: mypy (advisory)
        run: mypy src/ --ignore-missing-imports
