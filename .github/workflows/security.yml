name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * *" # diário
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo — o repo fresh-start nasce sem segredos

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: detect-secrets (baseline)
        run: |
          pip install detect-secrets
          detect-secrets scan --baseline .secrets.baseline
        # sai 0 se nenhum achado novo além do baseline

  deps:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .[dev]

      - name: pip-audit
        run: pipx run pip-audit --desc

  hygiene:
    name: forbidden-path test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pydantic
      - run: python -m pytest tests/test_repo_hygiene.py -q
