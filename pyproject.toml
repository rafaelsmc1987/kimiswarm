[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kdrx"
version = "0.3.0"
description = "KDR-X — KimiSwarm Deep Research eXtended: a research kernel with traceable evidence and selectable model CLI backends."
readme = "docs/KDRX_README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "KDR-X contributors" }]
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
pdf = ["pypdf>=5,<7"]
office = ["python-docx>=1.1,<2", "openpyxl>=3.1,<4"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
kdr = "kdrx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:^kdrx"]

[tool.coverage.run]
source = ["kdrx"]
omit = ["*/tests/*"]
